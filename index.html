  <title>Kalkulator Nilai Ujian Hifzh</title>  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

    :root {

    * {

    }

    html {

    }

    body {

    .container {
      width: min(100%, 720px);

    }

    .app-card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(222, 223, 217, 0.95);

    /* =========================
       HEADER
    ========================== */

    .header {
      text-align: center;
      margin-bottom: 27px;
    }

    h1 {
      margin: 0;
      color: var(--green-deep);
      font-size: clamp(24px, 5vw, 29px);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    /* =========================
       FORM
    ========================== */

    .field {
      margin-top: 17px;
    }

    .field:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #3e433e;
      font-size: 14px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      min-height: 47px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--white);
      color: var(--text);
      outline: none;
      appearance: auto;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #a2a6a1;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(79, 118, 89, 0.12);
    }

    .form-area {
      margin-top: 21px;
    }

    .dynamic-form {
      animation: formIn 0.25s ease;
    }

    @keyframes formIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    .calculate-button {
      width: 100%;
      min-height: 49px;
      margin-top: 24px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(61, 96, 71, 0.2);
      transition:
        background 0.18s ease,
        transform 0.15s ease,
        box-shadow 0.18s ease;
    }

    .calculate-button:hover {
      background: var(--green-dark);
      box-shadow: 0 8px 18px rgba(61, 96, 71, 0.25);
    }

    .calculate-button:active {
      transform: translateY(1px);
    }

    /* =========================
       HASIL
    ========================== */

    .result {
      margin-top: 28px;
      padding: 18px;
      border: 1px solid var(--green-border);
      border-radius: 15px;
      background: var(--green-soft);
      animation: resultIn 0.3s ease;
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-title {
      margin: 0 0 14px;
      color: var(--green-dark);
      font-size: 17px;
      font-weight: 700;
    }

    .result-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-item {
      min-width: 0;
      padding: 15px;
      border: 1px solid #dbe5dc;
      border-radius: 12px;
      background: #fff;
    }

    .result-item small {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .result-item strong {
      display: block;
      color: var(--green-deep);
      font-size: clamp(23px, 6vw, 29px);
      line-height: 1.2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    /* =========================
       RUMUS
    ========================== */

    details {
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #dbe5dc;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.88);
    }

    summary {
      padding: 12px 14px;
      cursor: pointer;
      color: #475149;
      font-size: 13px;
      font-weight: 650;
      user-select: none;
    }

    .formula {
      padding: 0 14px 15px;
      color: #4d534e;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .formula-title {
      margin-top: 8px;
      color: var(--green-dark);
      font-weight: 700;
    }

    .formula-result {
      color: var(--green-deep);
      font-weight: 700;
    }

    /* =========================
   TEKS PENYEMANGAT
========================= */

.encouragement {
  position: relative;
  min-height: 112px;
  margin: 26px 2px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* Ornamen atas dan bawah */
.encouragement::before,
.encouragement::after {
  position: absolute;
  left: 18%;
  right: 18%;
  height: 1px;
  content: "";
  background: linear-gradient(
    to right,
    transparent,
    #c9d8cb 18%,
    #c9d8cb 82%,
    transparent
  );
}

.encouragement::before {
  top: 7px;
}

.encouragement::after {
  bottom: 7px;
}

/* Ornamen kecil di tengah garis */
.encouragement-inner::before,
.encouragement-inner::after {
  position: absolute;
  left: 50%;
  width: 7px;
  height: 7px;
  content: "";
  background: #a9beaD;
  transform: translateX(-50%) rotate(45deg);
  border-radius: 1px;
}

.encouragement-inner::before {
  top: -2px;
}

.encouragement-inner::after {
  bottom: -2px;
}

.encouragement-inner {
  position: relative;
  z-index: 1;
  width: min(100%, 570px);
  padding: 18px 22px;
}

/*
  Teks dan emoji sekarang berada
  dalam satu inline flow.

  Jadi ketika teks menjadi 2 baris,
  emoji tetap menyatu dengan kalimat.
*/
.encouragement-text {
  display: block;
  color: #607664;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.75;
  opacity: 1;
  transition: opacity 0.8s ease;
  overflow-wrap: normal;
  word-break: normal;
}

.encouragement-text.fade-out {
  opacity: 0;
}

.encouragement-text.fade-in {
  animation: encouragementIn 0.8s ease;
}

.encouragement-text.rtl {
  direction: rtl;
  font-family:
    "SF Arabic",
    "San Francisco Arabic",
    "Noto Sans Arabic",
    "Segoe UI",
    Arial,
    sans-serif;
}

.encouragement-text.ltr {
  direction: ltr;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    "Segoe UI",
    Arial,
    sans-serif;
}

/*
  Emoji sengaja INLINE, bukan flex item.
  Dengan begitu emoji ikut mengalir bersama
  teks ketika kalimat turun ke baris berikutnya.
*/
.encouragement-emoji {
  display: inline;
  margin-inline-start: 4px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI Emoji",
    "Apple Color Emoji",
    sans-serif;
  font-style: normal;
  font-weight: 500;
  white-space: nowrap;
}

@keyframes encouragementIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

    /* =========================

    /* =========================

}
    }
  </style></head><body>  <main class="container">
    <div class="app-card">  <!-- HEADER -->
  <header class="header">
    <h1>Kalkulator Nilai Ujian Hifzh</h1>
    <p class="subtitle">
      Biar hitung-hitungan nggak ikut bikin pusing hihi..
    </p>
  </header>

  <!-- DATA DASAR -->
  <section>
    <div class="field">
      <label for="nama">Nama Santriwati</label>
      <input
        id="nama"
        type="text"
        autocomplete="name"
        placeholder="Masukkan nama santriwati"
      >

    <div class="field">
      <label for="jenis">Mau hitung ujian yang mana?</label>
      <select id="jenis">
        <option value="">Pilih jenis ujian</option>
        <option value="bulanan">Ujian Bulanan</option>
        <option value="semester">Ujian Semester</option>
      </select>

  </section>

  <!-- FORM DINAMIS -->
  <section id="dynamicForm" class="form-area dynamic-form hidden"></section>

  <!-- TOMBOL -->
  <button
    id="hitungBtn"
    class="calculate-button hidden"
    type="button"
  >
    Hitung Nilainya
  </button>

  <!-- HASIL -->
  <section
    id="hasil"
    class="result hidden"
    aria-live="polite"
  >
    <h2 class="result-title">Hasilnya nih 👇</h2>

    <div class="result-box">
      <div class="result-item">
        <small id="labelNilai">Nilai Ujian Per Juz</small>
        <strong id="nilai">-</strong>
      </div>

      <div id="bobotItem" class="result-item">
        <small>Bobot Nilai</small>
        <strong id="bobot">-</strong>
      </div>

    <details>

      <div id="rumus" class="formula"></div>

  <!-- TEKS PENYEMANGAT -->
  <section
    class="encouragement"
    aria-live="polite"
    aria-label="Pesan penyemangat"
  >

    <div class="encouragement-inner">
      <div id="encouragementText" class="encouragement-text"></div>

    <span class="encouragement-decoration right" aria-hidden="true"></span>

  <!-- RIWAYAT -->
  <section class="history-section">

    <div id="history" class="history"></div>

    <button
      id="hapusSemuaBtn"

      type="button"
    >
      Hapus Semua Riwayat
    </button>

  <!-- SIGNATURE -->
  <div class="signature">by Romlah</div>

  <div class="footer-note">
    Data riwayat tersimpan di perangkat ini.
  </div>

</div>

  </main>  <script>
    "use strict";

    /*
      ==========================================
      KALKULATOR NILAI UJIAN HIFZH
      ==========================================
    */

    const STORAGE_KEY = "riwayatHifzh";
    const OLD_STORAGE_KEY = "riwayatHifzhBulanan";

    const state = {
      formVersion: 0,
      encouragementIndex: 0,
      encouragementTimer: null
    };

    /*
      Emoji sengaja dipisahkan dari teks.
      Untuk bahasa Arab digunakan direction RTL
      agar emoji tetap berada di ujung visual kalimat.
    */
    const encouragements = [
      {
        text: "ما أجمل تفانيك، وما أروع بذلك، شكر الله سعيك",
        emoji: "🍄",
        direction: "rtl"
      },
      {
        text: "جزاك الله الدرجات العلى من الجنة",
        emoji: "🌻",
        direction: "rtl"
      },
      {
        text: "Terima kasih sudah menjadi bagian dari proses belajar mereka",
        emoji: "🤍",
        direction: "ltr"
      },
      {
        text: "Satu per satu, insyaallah selesai juga",
        emoji: "🌹",
        direction: "ltr"
      },
      {
        text: "سقى الله قلبك غيثا من السعادة",
        emoji: "🎈",
        direction: "rtl"
      },
      {
        text: "Semoga dimudahkan dalam setiap penilaian",
        emoji: "💐",
        direction: "ltr"
      },
      {
        text: "Semoga setiap lelah menjadi pahala di sisi Allah",
        emoji: "🤲",
        direction: "ltr"
      },
      {
        text: "Pelan-pelan, yang penting teliti dan tetap semangat",
        emoji: "🌿",
        direction: "ltr"
      },
      {
        text: "Semoga ini menjadi amal yang terus mengalir hingga anak² dewasa, aamiin",
        emoji: "🌸",
        direction: "ltr"
      },
      {
        text: "كتب الله أجرك وبارك في عملك",
        emoji: "🌸",
        direction: "rtl"
      }
    ];

    const els = {
      nama: document.getElementById("nama"),
      jenis: document.getElementById("jenis"),
      dynamicForm: document.getElementById("dynamicForm"),
      hitungBtn: document.getElementById("hitungBtn"),
      hasil: document.getElementById("hasil"),
      labelNilai: document.getElementById("labelNilai"),
      nilai: document.getElementById("nilai"),
      bobotItem: document.getElementById("bobotItem"),
      bobot: document.getElementById("bobot"),
      rumus: document.getElementById("rumus"),
      history: document.getElementById("history"),
      hapusSemuaBtn: document.getElementById("hapusSemuaBtn"),
      encouragementText: document.getElementById("encouragementText")
    };

    /*
      ==========================================
      FORMAT ANGKA
      ==========================================
    */

    function fmt(value) {
      return Number(value).toLocaleString("id-ID", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function angka(value) {
      return Number(value).toLocaleString("id-ID", {
        maximumFractionDigits: 10
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getNumber(id) {
      const element = document.getElementById(id);

      if (!element) {
        return NaN;
      }

      return Number(element.value);
    }

    /*
      ==========================================
      HTML FIELD HELPERS
      ==========================================
    */

    function fieldHtml({
      id,
      label,
      type = "number",
      min = "",
      max = "",
      step = "1",
      placeholder = "",
      note = ""
    }) {
      const minAttr = min !== "" ? ` min="${min}"` : "";
      const maxAttr = max !== "" ? ` max="${max}"` : "";
      const stepAttr = step !== "" ? ` step="${step}"` : "";

      return `
        <div class="field">
          <label for="${id}">${label}</label>

          <input
            id="${id}"
            type="${type}"
            ${minAttr}
            ${maxAttr}
            ${stepAttr}
            placeholder="${placeholder}"
            ${type === "number" ? 'inputmode="decimal"' : ""}
          >

          ${
            note
              ? `<div class="note">${note}</div>`
              : ""
          }
        </div>
      `;
    }

    function selectHtml({
      id,
      label,
      options
    }) {
      return `
        <div class="field">
          <label for="${id}">${label}</label>

          <select id="${id}">
            <option value="">Pilih...</option>

            ${options.map(option => `
              <option value="${option.value}">
                ${option.label}
              </option>
            `).join("")}
          </select>
        </div>
      `;
    }

    /*
      ==========================================
      HASIL
      ==========================================
    */

    function resetResult() {
      els.hasil.classList.add("hidden");
      els.nilai.textContent = "-";
      els.bobot.textContent = "-";
      els.rumus.innerHTML = "";
    }

    function showCalculateButton(show) {
      els.hitungBtn.classList.toggle("hidden", !show);
    }

    function tampilkanHasil({
      labelNilai,
      nilai,
      bobot,
      rumus
    }) {
      els.labelNilai.textContent = labelNilai;
      els.nilai.textContent = fmt(nilai);
      els.rumus.innerHTML = rumus;

      const adaBobot = Number.isFinite(bobot);

      els.bobotItem.classList.toggle(
        "hidden",
        !adaBobot
      );

      els.bobot.textContent =
        adaBobot
          ? fmt(bobot)
          : "-";

      els.hasil.classList.remove("hidden");

      requestAnimationFrame(() => {
        els.hasil.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
      });
    }

    /*
     
      ==========================================
      RENDER FORM UTAMA
      ==========================================
    */

    function renderForm() {
      const jenis = els.jenis.value;

      state.formVersion += 1;

      const currentVersion = state.formVersion;

      resetResult();

      if (!jenis) {
        els.dynamicForm.innerHTML = "";
        els.dynamicForm.classList.add("hidden");
        showCalculateButton(false);
        return;
      }

      els.dynamicForm.classList.remove("hidden");
      showCalculateButton(true);

      /*
        UJIAN BULANAN
      */

      if (jenis === "bulanan") {
        els.dynamicForm.innerHTML = `
          ${selectHtml({
            id: "materiBulanan",
            label: "Materinya apa?",
            options: [
              {
                value: "30",
                label: "Juz 30"
              },
              {
                value: "lebih",
                label: "Lebih dari 1 Juz"
              }
            ]
          })}

          <div id="bulananDetail"></div>
        `;

        const materiBulanan =
          document.getElementById("materiBulanan");

        materiBulanan.addEventListener(
          "change",
          () => {
            if (currentVersion !== state.formVersion) {
              return;
            }

            renderBulananDetail();
          }
        );

        renderBulananDetail();
        return;
      }

      /*
        UJIAN SEMESTER

    function validateCommon(
      nama,
      kesalahan
    ) {
      if (!nama) {
        alert("Nama santriwati belum diisi.");
        els.nama.focus();
        return false;
      }

      if (
        !Number.isFinite(kesalahan) ||

      ) {
        alert(

        );

        document
          .getElementById("kesalahan")
          ?.focus();

        return false;
      }

      return true;

    /*
      ==========================================
      HITUNG BULANAN
      ==========================================
    */

    function hitungBulanan() {
      const materi =
        document.getElementById(
          "materiBulanan"
        )?.value;

      const nama =
        els.nama.value.trim();

      const kesalahan =
        getNumber("kesalahan");

      if (!materi) {
        alert(
          "Silakan pilih materi ujian terlebih dahulu."
        );

        document
          .getElementById("materiBulanan")
          ?.focus();

        return;
      }

      if (
        !validateCommon(
          nama,
          kesalahan
        )
      ) {
        return;
      }

      let nilai;
      let bobot;
      let halaman = null;
      let jumlahJuz = null;
      let rumus = "";

      /*
        BULANAN → JUZ 30

        Nilai:
        100 - ((kesalahan × 2 × 23) ÷ halaman)

        Bobot:
        nilai × (halaman ÷ 23)
      */

      if (materi === "30") {
        halaman =
          getNumber("halaman");

        if (
          !Number.isFinite(halaman) ||
          halaman <= 0
        ) {
          alert(
            "Jumlah halaman disetor harus lebih dari 0."
          );

          document
            .getElementById("halaman")
            ?.focus();

          return;
        }

        const totalHalaman = 23;

        nilai =
          100 -
          (
            kesalahan *
            2 *
            totalHalaman
          ) /
            halaman;

        bobot =
          nilai *
          (
            halaman /
            totalHalaman
          );

        rumus = `
          <div class="formula-title">
            Nilai Ujian Per Juz
          </div>

          <div>
            = 100 - ((${angka(kesalahan)} × 2 × 23) ÷ ${angka(halaman)})
          </div>

          <div>
            = 100 - (${angka(kesalahan * 2 * totalHalaman)} ÷ ${angka(halaman)})
          </div>

          <div class="formula-result">
            = ${fmt(nilai)}
          </div>

          <div class="formula-title">
            Bobot Nilai
          </div>

          <div>
            = ${fmt(nilai)} × (${angka(halaman)} ÷ 23)
          </div>

          <div class="formula-result">
            = ${fmt(bobot)}
          </div>
        `;
      }

      /*
        BULANAN → LEBIH DARI 1 JUZ

        Nilai:
        100 - (kesalahan × 2)

        Bobot:
        nilai × jumlah juz
      */

      else {
        jumlahJuz =
          getNumber("jumlahJuz");

        if (
          !Number.isInteger(jumlahJuz) ||
          jumlahJuz < 1 ||
          jumlahJuz > 5
        ) {
          alert(
            "Jumlah juz yang diujikan harus 1 sampai 5 juz."
          );

          document
            .getElementById("jumlahJuz")
            ?.focus();

          return;
        }

        nilai =
          100 -
          kesalahan * 2;

        bobot =
          nilai *
          jumlahJuz;

        rumus = `
          <div class="formula-title">
            Nilai Ujian Bulanan
          </div>

          <div>
            = 100 - (${angka(kesalahan)} × 2)
          </div>

          <div class="formula-result">
            = ${fmt(nilai)}
          </div>

          <div class="formula-title">
            Bobot Nilai
          </div>

          <div>
            = ${fmt(nilai)} × ${angka(jumlahJuz)}
          </div>

          <div class="formula-result">
            = ${fmt(bobot)}
          </div>
        `;
      }

      tampilkanHasil({
        labelNilai:
          materi === "30"
            ? "Nilai Ujian Per Juz"
            : "Nilai Ujian Bulanan",

        nilai,
        bobot,
        rumus
      });

      simpanRiwayat({
        id: createId(),
        waktu:
          new Date().toLocaleString(
            "id-ID"
          ),
        nama,
        ujian: "Ujian Bulanan",
        materi:
          materi === "30"
            ? "Juz 30"
            : "Lebih dari 1 Juz",
        kesalahan,
        halaman,
        jumlahJuz,
        nilai,
        bobot
      });
    }

    /*
      ==========================================
      RIWAYAT
      ==========================================
    */

    function createId() {
      return (
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2, 9)
      );
    }

    function ambilRiwayat() {
      try {
        const data =
          JSON.parse(
            localStorage.getItem(
              STORAGE_KEY
            )
          );

        return Array.isArray(data)
          ? data
          : [];
      } catch {
        return [];
      }
    }

    function simpanRiwayat(data) {
      const riwayat =
        ambilRiwayat();

      riwayat.unshift(data);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          riwayat.slice(0, 200)
        )
      );

      tampilkanRiwayat();
    }

    /*
      Membawa riwayat dari HTML lama
      supaya upgrade tidak menghilangkan
      data yang sudah ada di perangkat.
    */

    function migrasiRiwayatLama() {
      if (
        localStorage.getItem(
          STORAGE_KEY
        )
      ) {
        return;
      }

      try {
        const oldData =
          JSON.parse(
            localStorage.getItem(
              OLD_STORAGE_KEY
            )
          );

        if (
          !Array.isArray(oldData) ||
          oldData.length === 0
        ) {
          return;
        }

        const migrated =
          oldData.map(item => ({
            id:
              item.id ||
              createId(),

            waktu:
              item.waktu ||
              "-",

            nama:
              item.nama ||
              "-",

            ujian:
              "Ujian Bulanan",

            materi:
              item.jenis ||
              "-",

            kesalahan:
              Number(
                item.kesalahan
              ) || 0,

            halaman:
              item.halaman ??
              null,

            jumlahJuz:
              item.jumlahJuz ??
              null,

            nilai:
              Number(
                item.nilai
              ) || 0,

            bobot:
              Number.isFinite(
                Number(item.bobot)
              )
                ? Number(item.bobot)
                : null
          }));

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            migrated
          )
        );
      } catch {
        /*
          Jika data lama tidak dapat dibaca,
          aplikasi tetap berjalan normal.
        */
      }
    }

    function tampilkanRiwayat() {
      const riwayat =
        ambilRiwayat();

      if (!riwayat.length) {
        els.history.innerHTML = `
          <div class="empty">
            Belum ada riwayat.
            Hasil perhitungan nanti akan muncul di sini.
          </div>
        `;

        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Ujian</th>
              <th>Materi</th>
              <th>Kesalahan</th>
              <th>Hlm</th>
              <th>Juz</th>
              <th>Nilai</th>
              <th>Bobot</th>
              <th>Waktu</th>
              <th></th>
            </tr>
          </thead>

          <tbody>
      `;

            for (const item of riwayat) {
        const bobotText =
          Number.isFinite(
            Number(item.bobot)
          )
            ? fmt(item.bobot)
            : "-";

        html += `
          <tr>
            <td>
              ${escapeHtml(
                item.nama
              )}
            </td>

            <td>
              ${escapeHtml(
                item.ujian ||
                "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                item.materi ||
                "-"
              )}
            </td>

            <td>
              ${angka(
                item.kesalahan ??
                0
              )}
            </td>

            <td>
              ${
                item.halaman !==
                  null &&
                item.halaman !==
                  undefined
                  ? angka(
                      item.halaman
                    )
                  : "-"
              }
            </td>

            <td>
              ${
                item.jumlahJuz !==
                  null &&
                item.jumlahJuz !==
                  undefined
                  ? angka(
                      item.jumlahJuz
                    )
                  : "-"
              }
            </td>

            <td>
              ${fmt(item.nilai)}
            </td>

            <td>
              ${bobotText}
            </td>

            <td>
              ${escapeHtml(
                item.waktu ||
                "-"
              )}
            </td>

            <td>
              <button
                class="delete-btn"
                type="button"
                data-delete-id="${escapeHtml(item.id)}"
                aria-label="Hapus riwayat"
                title="Hapus"
              >
                ×
              </button>
            </td>
          </tr>
        `;
      }

      html += `
          </tbody>
        </table>
      `;

      els.history.innerHTML =
        html;
    }

    function hapusRiwayat(id) {
      const riwayat =
        ambilRiwayat()
          .filter(
            item =>
              String(item.id) !==
              String(id)
          );

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          riwayat
        )
      );

      tampilkanRiwayat();
    }

    function hapusSemuaRiwayat() {
      const riwayat =
        ambilRiwayat();

      if (!riwayat.length) {
        return;
      }

      const yakin =
        confirm(
          "Hapus semua riwayat perhitungan?"
        );

      if (!yakin) {
        return;
      }

      localStorage.removeItem(
        STORAGE_KEY
      );

      tampilkanRiwayat();
    }

    /*

    
      ==========================================
      TEKS PENYEMANGAT
      ==========================================
    */

    function renderEncouragement(
      index,
      animate = false
    ) {
      const item =
        encouragements[index];

      const target =
        els.encouragementText;

      if (animate) {
        target.classList.remove(
          "fade-in"
        );

        target.classList.add(
          "fade-out"
        );

        window.setTimeout(
          () => {
            setEncouragementContent(
              item
            );

            target.classList.remove(
              "fade-out"
            );

            target.classList.add(
              "fade-in"
            );
          },
          800
        );

        return;
      }

      setEncouragementContent(
        item
      );
    }

    function setEncouragementContent(item) {
  els.encouragementText.className =
    `encouragement-text ${item.direction}`;

  /*
    Teks + emoji sengaja dibuat sebagai satu
    inline content.

    Hasilnya:
    "Semoga ini menjadi amal yang terus mengalir
     hingga anak² dewasa, aamiin. 🌸"

    Kalau kalimat turun baris, emoji tetap
    mengikuti ujung kalimat dan tidak terpisah.
  */
  els.encouragementText.innerHTML = `
    <span class="encouragement-message">
      ${escapeHtml(item.text)}
      <span
        class="encouragement-emoji"
        aria-hidden="true"
      >${item.emoji}</span>
    </span>
  `;
    }

    function mulaiPesanPenyemangat() {
      if (
        state.encouragementTimer
      ) {
        clearInterval(
          state.encouragementTimer
        );
      }

      state.encouragementIndex = 0;

      renderEncouragement(
        0,
        false
      );

      /*
        Timing:
        ±10 detik tampil
        0,8 detik fade out
        ganti teks
        0,8 detik fade in

        Pergantian dimulai sekitar
        setiap 11,6 detik.
      */

      state.encouragementTimer =
        window.setInterval(
          () => {
            state.encouragementIndex =
              (
                state.encouragementIndex +
                1
              ) %
              encouragements.length;

            renderEncouragement(
              state.encouragementIndex,
              true
            );
          },
          11600
        );
    }

          .catch((error) => {
